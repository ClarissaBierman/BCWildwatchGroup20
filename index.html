<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BC WildWatch™ | Campus Safety Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>

    /* ── THEME VARIABLES ── */
    :root {
      --red:      #c0000c;
      --red-dark: #8a0008;
      --yellow:   #f5c518;
    }

    [data-theme="light"] {
      --bg:          #f4f2ee;
      --surface:     #ffffff;
      --border:      #e0ddd7;
      --text:        #1a1a1a;
      --text-muted:  #777;
      --text-faint:  #aaa;
      --sidebar-bg:  #1a1a1a;
      --nav-text:    #bbb;
      --stripe-gap:  #e0ddd7;
      --footer-bg:   #1a1a1a;
      --footer-text: #555;
      --pagebar-bg:  #ffffff;
      --pagebar-bdr: #e0ddd7;
      --tog-bdr:     #e0ddd7;
    }

    [data-theme="dark"] {
      --bg:          #0d0d0d;
      --surface:     #1a1a1a;
      --border:      #2a2a2a;
      --text:        #f0ede6;
      --text-muted:  #888;
      --text-faint:  #444;
      --sidebar-bg:  #111111;
      --nav-text:    #999;
      --stripe-gap:  #111;
      --footer-bg:   #111111;
      --footer-text: #444;
      --pagebar-bg:  #1a1a1a;
      --pagebar-bdr: #2a2a2a;
      --tog-bdr:     #333;
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: background 0.25s, color 0.25s;
    }

    /* ── WARNING STRIPE ── */
    .stripe {
      height: 5px;
      flex-shrink: 0;
      background: repeating-linear-gradient(
        -45deg,
        var(--yellow) 0px, var(--yellow) 8px,
        var(--stripe-gap) 8px, var(--stripe-gap) 16px
      );
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 22px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      transition: background 0.25s, border-color 0.25s;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--red);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 21px;
      height: 21px;
      fill: var(--yellow);
    }

    .logo-name {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 1px;
      text-transform: uppercase;
      display: block;
      line-height: 1.1;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Theme toggle button */
    .toggle-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--tog-bdr);
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: background 0.2s, color 0.2s;
    }

    .toggle-btn:hover { background: var(--bg); color: var(--text); }
    .toggle-btn svg { width: 15px; height: 15px; pointer-events: none; }

    .icon-sun  { display: block; }
    .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun  { display: none; }
    [data-theme="dark"] .icon-moon { display: block; }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR (always dark) ── */
    .sidebar {
      width: 190px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 20px 0 12px;
      transition: background 0.25s;
    }

    .nav-section {
      font-size: 9px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #3a3a3a;
      padding: 0 16px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 16px;
      color: var(--nav-text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-left: 3px solid transparent;
      text-decoration: none;
      transition: all 0.15s;
      user-select: none;
    }

    .nav-item:hover {
      color: #fff;
      background: rgba(255,255,255,0.05);
      border-left-color: #555;
    }

    .nav-item.active {
      color: var(--yellow);
      background: rgba(245,197,24,0.07);
      border-left-color: var(--yellow);
    }

    .nav-item svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      opacity: 0.55;
    }

    .nav-item.active svg,
    .nav-item:hover svg { opacity: 1; }

    .nav-signout { color: #c0392b !important; }
    .nav-signout svg { opacity: 1 !important; }

    .sidebar-foot {
      margin-top: auto;
      padding: 13px 16px 0;
      border-top: 1px solid #222;
      font-size: 10px;
      color: #333;
      line-height: 1.7;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pagebar {
      background: var(--pagebar-bg);
      border-bottom: 1px solid var(--pagebar-bdr);
      padding: 0 18px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      transition: background 0.25s, border-color 0.25s;
    }

    .pagebar-title {
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text);
    }

    .iframe-wrap {
      flex: 1;
      overflow: hidden;
    }

    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--footer-bg);
      padding: 8px 20px;
      font-size: 10px;
      color: var(--footer-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.25s;
    }

    .f-red  { color: var(--red); font-weight: 600; }
    .f-gold { color: #c9a000; }

  </style>
</head>
<body>

  <div class="stripe"></div>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-icon">
        <!-- Paw print -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="6"    cy="5"   rx="2"   ry="2.8"/>
          <ellipse cx="11.5" cy="3.5" rx="2"   ry="2.8"/>
          <ellipse cx="17"   cy="5"   rx="2"   ry="2.8"/>
          <ellipse cx="4.5"  cy="10"  rx="1.6" ry="2.2"/>
          <path d="M7.5 10.5c0-3 9-3 9 0 0 5-2 8-4.5 8s-4.5-3-4.5-8z"/>
        </svg>
      </div>
      <div>
        <span class="logo-name">BC WildWatch™</span>
        <span class="logo-sub">Belgium Campus iTversity</span>
      </div>
    </div>

    <!-- Light / Dark toggle -->
    <button class="toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1"  x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22"   x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1"  y1="12" x2="3"  y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78"  x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="nav-section">Navigation</div>

      <a class="nav-item active" onclick="setActive(this)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        Dashboard
      </a>

      <a class="nav-item" onclick="setActive(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9"  x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        Report Incident
      </a>

      <a class="nav-item" onclick="setActive(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        My Reports
      </a>

      <a class="nav-item" onclick="setActive(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8"  y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        Reports &amp; BI
      </a>

      <a class="nav-item" onclick="setActive(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Help &amp; Chatbot
      </a>

      <div style="margin-top:20px;">
        <div class="nav-section">Account</div>
        <a class="nav-item nav-signout">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </a>
      </div>

      <div class="sidebar-foot">
        <div>Module INL37(8)1</div>
        <div>Group 20 &middot; 2026</div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main>
      <div class="pagebar">
        <span class="pagebar-title">Dashboard — Power Apps</span>
      </div>
      <div class="iframe-wrap">
        <iframe
          src="https://apps.powerapps.com/play/e/93aeb50b-f731-e2b9-bc9b-fcba74297f52/a/72a2b1a8-f9a6-4540-9f7e-14716ca192c3?tenantId=ea1a909b-6600-4a25-82a5-0c6ed7d0513b&hint=bfd67233-8d90-4ee9-bc81-76fb7b4cd82a&sourcetime=1774522195474"
          allow="camera; microphone; geolocation"
          title="BC WildWatch Power App">
        </iframe>
      </div>
    </main>

  </div>

  <!-- FOOTER -->
  <footer>
    <span>© 2026 <span class="f-red">Belgium Campus iTversity</span> · BC WildWatch™ · Group 20</span>
    <span>INL37(8)1 · <span class="f-gold">Microsoft Entra ID</span></span>
  </footer>

  <script>
    // Restore saved theme on load (default is light)
    (function () {
      const saved = localStorage.getItem('ww-theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();

    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('ww-theme', next);
    }

    function setActive(el) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
    }
  </script>

</body>
</html>
